<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Expense Tracker · Transactions</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}" rel="stylesheet">
    <style>body { background: #f5f7fb; } .brand-mark { color: #147d64; } .panel { border: 0; border-radius: 1rem; box-shadow: 0 8px 24px rgba(25, 38, 59, .06); } .table > :not(caption) > * > * { padding: .85rem .75rem; }</style>
</head>
<body>
<nav class="navbar bg-white border-bottom"><div class="container py-2">
    <a class="navbar-brand fw-bold brand-mark" th:href="@{/dashboard}">Pocket Ledger</a>
    <div class="d-flex gap-2"><a class="btn btn-sm btn-outline-secondary" th:href="@{/dashboard}">Dashboard</a><a class="btn btn-sm btn-success" th:href="@{/transactions/new}">Add transaction</a></div>
</div></nav>
<main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
        <div><p class="text-uppercase text-secondary small fw-semibold mb-1">Ledger</p><h1 class="h2 mb-0">Transactions</h1></div>
        <a class="btn btn-success px-4" th:href="@{/transactions/new}">＋ Add transaction</a>
    </div>
    <section class="card panel mb-4"><div class="card-body p-4">
        <form class="row g-3 align-items-end" method="get" th:action="@{/transactions}">
            <div class="col-md-4"><label class="form-label" for="type">Type</label><select class="form-select" id="type" name="type"><option value="">All types</option><option th:each="item : ${transactionTypes}" th:value="${item}" th:text="${item}" th:selected="${item == selectedType}"></option></select></div>
            <div class="col-md-4"><label class="form-label" for="category">Category</label><select class="form-select" id="category" name="category"><option value="">All categories</option><option th:each="item : ${categories}" th:value="${item}" th:text="${item}" th:selected="${item == selectedCategory}"></option></select></div>
            <div class="col-md-4 d-flex gap-2"><button class="btn btn-dark" type="submit">Apply filters</button><a class="btn btn-outline-secondary" th:href="@{/transactions}">Clear</a></div>
        </form>
    </div></section>
    <section class="card panel"><div class="card-body p-4"><div class="table-responsive">
        <table class="table align-middle mb-0">
            <thead><tr class="text-secondary small"><th>Date</th><th>Category</th><th>Description</th><th>Type</th><th class="text-end">Amount</th><th class="text-end">Actions</th></tr></thead>
            <tbody>
            <tr th:each="transaction : ${transactions}">
                <td th:text="${#temporals.format(transaction.date, 'dd MMM yyyy')}">01 Jan 2026</td>
                <td class="fw-semibold" th:text="${transaction.category}">Category</td>
                <td class="text-secondary" th:text="${transaction.description ?: '—'}">Description</td>
                <td><span class="badge rounded-pill" th:classappend="${transaction.type.name() == 'INCOME'} ? ' text-bg-success' : ' text-bg-danger'" th:text="${transaction.type}">EXPENSE</span></td>
                <td class="text-end fw-semibold" th:classappend="${transaction.type.name() == 'INCOME'} ? ' text-success' : ' text-danger'" th:text="${(transaction.type.name() == 'INCOME' ? '+' : '−') + #numbers.formatDecimal(transaction.amount, 1, 'COMMA', 2, 'POINT')}">0.00</td>
                <td class="text-end text-nowrap">
                    <a class="btn btn-sm btn-outline-secondary" th:href="@{/transactions/{id}/edit(id=${transaction.id})}">Edit</a>
                    <form class="d-inline" method="post" th:action="@{/transactions/{id}/delete(id=${transaction.id})}"><button class="btn btn-sm btn-outline-danger" type="submit">Delete</button></form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(transactions)}"><td colspan="6" class="text-center text-secondary py-5">No matching transactions found.</td></tr>
            </tbody>
        </table>
    </div></div></section>
</main>
</body>
</html>
